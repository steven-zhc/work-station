---
# Docker CE（官方 apt 源）
# 对应 mac-module/docker.yml（那边是 podman）。
# 依赖 linux-local.yml 开头探测出来的 ubuntu_codename。

- name: 创建 keyrings 目录
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  become: true
  tags: [docker-all, docker]

- name: 下载 Docker apt 签名密钥
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  become: true
  tags: [docker-all, docker]

- name: 添加 Docker apt 源
  ansible.builtin.apt_repository:
    # 用 ubuntu_codename 而不是 VERSION_CODENAME / ansible_facts['lsb']['codename']：
    # Mint 22.2 的自有代号是 zara，Docker 源里没有这个发行版。
    repo: "deb [arch={{ ansible_facts['architecture'] | replace('x86_64','amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename }} stable"
    filename: docker
    state: present
  become: true
  tags: [docker-all, docker]

- name: Install Docker CE 与插件
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  become: true
  tags: [docker-all, docker]

- name: 启用 docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  become: true
  tags: [docker-all, docker]

- name: 把当前用户加进 docker 组
  ansible.builtin.user:
    name: "{{ lookup('env','USER') }}"
    groups: docker
    append: true
  become: true
  register: docker_group
  tags: [docker-all, docker]

- name: 提示需要重新登录
  ansible.builtin.debug:
    msg: >-
      已加进 docker 组 —— 需要注销重新登录才生效。
      验证：id -nG | tr ' ' '\n' | grep -x docker
  when: docker_group is changed
  tags: [docker-all, docker]
