---
# Shell configuration (Debian/Ubuntu)
# 对应 mac-module/shell.yml

- name: Install Fish shell
  ansible.builtin.apt:
    name: fish
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [shell-all, fish]

- name: Ensure the Fish configuration directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/fish/conf.d"
    state: directory
    mode: "0755"
  tags: [shell-all, fish]

- name: Source custom env file in Fish
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/fish/config.fish"
    line: "test -f ~/.config/fish/env.fish; and source ~/.config/fish/env.fish"
    create: true
    mode: "0644"
  tags: [shell-all, fish]

- name: Source aliases file in Fish
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/fish/config.fish"
    line: "test -f ~/.config/fish/aliases.fish; and source ~/.config/fish/aliases.fish"
    create: true
    mode: "0644"
  tags: [shell-all, fish]

- name: Add ~/.local/bin to the Fish PATH
  # cli.yml 里的 bat/fd 链接、mise 和 uv 都在这里
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/fish/config.fish"
    line: "fish_add_path ~/.local/bin"
    create: true
    mode: "0644"
  tags: [shell-all, fish]

- name: Change default shell to Fish
  ansible.builtin.user:
    name: "{{ lookup('env','USER') }}"
    shell: /usr/bin/fish
  become: true
  tags: [shell-all, fish]

- name: Install Starship prompt
  # apt 源里没有（或版本很旧），用官方脚本；已装则跳过
  ansible.builtin.shell: curl -fsSL https://starship.rs/install.sh | sh -s -- --yes
  args:
    creates: /usr/local/bin/starship
  become: true
  tags: [shell-all, starship]

- name: Ensure starship init in fish config
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/fish/config.fish"
    line: "starship init fish | source"
    create: true
    mode: "0644"
  tags: [shell-all, starship]
