---
# Python Development Environment

- name: Ensure uv installer script is run
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: "{{ lookup('env','HOME') }}/.local/bin/uv"
  environment:
    HOME: "{{ lookup('env','HOME') }}"
  tags: [python-all, uv]

- name: Verify uv command is available
  # 全路径：全新机器上 ~/.local/bin 还不在 ansible 进程的 PATH 里
  command: "{{ lookup('env','HOME') }}/.local/bin/uv --version"
  register: uv_check
  ignore_errors: yes
  tags: [python-all, uv]

- name: Install latest Python via uv
  shell: "{{ lookup('env','HOME') }}/.local/bin/uv python install"
  tags: [python-all, python, python-install]