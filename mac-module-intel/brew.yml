---
# Homebrew 前缀差异
#
# Intel Mac 的 brew 装在 /usr/local，Apple Silicon 在 /opt/homebrew。
# mac-module/ 里已经有几处按 ansible_facts['architecture'] 分叉（java.yml 的 OpenJDK
# 软链、mac-local.yml 的 fish_shell_path），这里补上 shellenv ——
# 它除了 PATH 还会设 HOMEBREW_PREFIX / MANPATH / INFOPATH。

- name: Verify Homebrew is installed in /usr/local
  ansible.builtin.stat:
    path: /usr/local/bin/brew
  register: intel_brew
  tags: [intel-all, brew]

- name: Fail clearly when Intel Homebrew is missing
  ansible.builtin.assert:
    that: intel_brew.stat.exists
    fail_msg: >-
      /usr/local/bin/brew does not exist. Homebrew should be installed in
      /usr/local on an Intel Mac. If it is in /opt/homebrew, run this playbook
      only on an Intel Mac and use mac-local.yml on Apple Silicon.
  tags: [intel-all, brew]

- name: Ensure brew shellenv in fish config
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/fish/config.fish"
    line: 'eval (/usr/local/bin/brew shellenv)'
    create: true
    mode: "0644"
  tags: [intel-all, brew]
